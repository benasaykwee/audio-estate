name: PALLBEARER

# LAYOUT NOTE. This file belongs at the ESTATE ROOT, not inside PALLBEARER/.
# GitHub only reads workflows from <repo-root>/.github/workflows — a copy
# living at PALLBEARER/.github/workflows is silently ignored, which is the
# failure mode that leaves a project with no CI and no error to notice.
#
# Because the checkout lands at the estate root, every `run:` step needs to
# start inside PALLBEARER/. That is what `defaults.run.working-directory`
# does. It applies to `run:` steps ONLY — inputs to `uses:` actions (notably
# upload-artifact's `path:`) are resolved from the repo root and must name
# PALLBEARER/ explicitly.

on:
  push:
    paths: ['PALLBEARER/**', 'shared/**', '.github/workflows/pallbearer.yml']
  pull_request:
    paths: ['PALLBEARER/**', 'shared/**', '.github/workflows/pallbearer.yml']

# ADDED 2026-08-18. Every trilogy workflow used to trigger on every push with
# no filter, so a CASKET-only commit still paid for AUTOPSY's, RIGOR's and
# PALLBEARER's own harnesses AND their 10x-billed macOS plugin builds, for no
# reason found in any of their triggers. shared/** stays in the filter
# deliberately — PALLBEARER's own tests import it directly, per its own
# README: PALLBEARER has no dynamics stage but still leans on shared/necromath.

jobs:
  harnesses:
    name: JS harnesses + parity gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PALLBEARER
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Core harness
        run: node pallbearer_test.js

      # ADDED 2026-08-23. A gate audit found PALLBEARER was the only
      # instrument with no test for its tests: AUTOPSY has an audit harness,
      # RIGOR has an audit and a mutation tester, CASKET has three, and
      # PALLBEARER had none while carrying the largest parity count in the
      # estate. Green said something about the engine and nothing about the
      # harness.
      #
      # It earned its place the day it was written. Ten hand-written
      # mutations, THREE survived every harness on the project, and the
      # assertions that now kill them are section XXIII of the core harness.
      # A short-decay boundary, the open-string preference in the fingering
      # brain, and an inclusive fret bound: none of them were covered by the
      # named assertions, the byte-stable baselines OR the fuzzer.
      #
      # It runs the full sweep because a partial one is how a mutant quietly
      # stops being checked. Generous timeout: each mutant runs the witness
      # in a child process, and a mutant that HANGS is itself a finding.
      - name: Mutation tester (a test for the tests)
        run: node tests/pallbearer_mutate.js
        timeout-minutes: 30

      - name: Plugin parameter parity (no compiler needed)
        run: node tests/pallbearer_plugin_test.js

      - name: Regression (byte-stable baselines)
        run: node tests/pallbearer_regression.js

      - name: Fuzz (seeded, reproducible)
        run: node tests/pallbearer_fuzz.js

      - name: Underworld handoff
        run: node tests/underworld_handoff.js

      - name: Sync is current (embed byte-identical)
        run: node pallbearer_sync.js --check

      # Emit, then prove it did not move — the same shape as the gate itself.
      # If the JS core changed and nobody re-emitted, this fails here rather
      # than producing a gate that quietly tests yesterday's truth.
      - name: Parity gate (JS truth vs C++ twin, bit-exact)
        run: |
          node tests/parity_emit.js
          git diff --exit-code tests/parity_expected.h
          mkdir -p build
          g++ -std=c++17 -O2 -ffp-contract=off -o build/pb_parity tests/core_parity.cpp
          ./build/pb_parity

      # LAW 1's control USED TO LIVE HERE, and it is why runs #1 and #2 both
      # died at 27 and 28 seconds without either plugin job ever executing.
      # It has moved to the law1-arm job below, where it can actually be false.
      # What stays here is the measurement that explains the move — it asserts
      # nothing, it just records what the flag is worth on this architecture.
      - name: What -ffp-contract=off is worth on this architecture (evidence, not a gate)
        run: |
          set -uo pipefail
          echo "arch: $(uname -m)"
          echo "baseline FMA macros:"
          g++ -dM -E -x c++ /dev/null | grep -E '__FMA__|__FP_FAST_FMA\b|__ARM_FEATURE_FMA' \
            || echo "  (none — this target has no baseline FMA instruction)"

          # The decisive test, and the reason it is a test rather than an
          # argument: if the flag changes nothing in the generated object
          # code, then the flagged and unflagged parity binaries are the same
          # program and no control built on the difference can ever fail.
          g++ -std=c++17 -O2 -ffp-contract=off -c -o /tmp/with.o    tests/core_parity.cpp
          g++ -std=c++17 -O2                   -c -o /tmp/without.o tests/core_parity.cpp
          if cmp -s /tmp/with.o /tmp/without.o; then
            echo "::notice::-ffp-contract=off is a NO-OP on $(uname -m) — object code byte-identical, so the LAW 1 control cannot fail on this runner"
          else
            echo "::notice::-ffp-contract=off CHANGES codegen on $(uname -m) — the control is meaningful here"
          fi

  # ---------------------------------------------------------------------------
  # LAW 1's control, on an architecture where it can be false.
  #
  # WHY THIS JOB EXISTS. Runs #1 and #2 both failed at "LAW 1 still bites"
  # inside the harnesses job on ubuntu-latest. The unflagged build PASSED
  # parity there, so the guard fired, exited 1, and killed the run before
  # plugin-compile-check or plugin-macos had executed even once.
  #
  # The guard was not broken. It was architecture-blind. Baseline x86-64 has
  # no FMA instruction without -mfma or a raised -march, so there is nothing
  # for -ffp-contract=off to switch off and the two builds are the same
  # program. Baseline aarch64 defines __ARM_FEATURE_FMA, GCC contracts freely,
  # and the law bites enormously: 8,693 of 13,335 checks fail, worst
  # 14,301,684 ulp, measured 2026-08-21.
  #
  # The mechanism, disassembled 2026-08-22 rather than argued: compiling
  # tests/core_parity.cpp on aarch64 WITHOUT the flag emits 358 fmadd and 43
  # fmsub instructions. WITH the flag it emits zero of either. That is the
  # whole of LAW 1 in two numbers — 401 fused operations that each keep an
  # intermediate at infinite precision instead of rounding it.
  #
  # So the control moves to arm64 rather than being relaxed. A gate that stops
  # biting is evidence, not noise, and the fix for a silent gate is to run it
  # somewhere it can speak — never to soften what it asserts. arm64 runners are
  # free on public repositories and this repository is public.
  law1-arm:
    name: LAW 1 still bites (arm64, where the control is real)
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: PALLBEARER
    steps:
      - uses: actions/checkout@v5

      - name: The unflagged build must FAIL parity
        run: |
          set -uo pipefail
          mkdir -p build
          echo "arch: $(uname -m)"
          g++ -dM -E -x c++ /dev/null | grep -E '__ARM_FEATURE_FMA|__FP_FAST_FMA\b' || true

          # COMPILE AND RUN ARE SEPARATED DELIBERATELY, and this is the second
          # fault the old step had. It read:
          #
          #     g++ ... -o build/pb_fma tests/core_parity.cpp
          #     if ./build/pb_fma > /dev/null 2>&1; then ... exit 1; fi
          #     echo "confirmed: the unflagged build still fails, as it must"
          #
          # If g++ FAILED there was no binary, the `if` went false, and the
          # step printed "confirmed" and passed. A build that does not compile
          # is not evidence about floating-point contraction — it is a broken
          # build wearing a green tick.
          if ! g++ -std=c++17 -O2 -o build/pb_fma tests/core_parity.cpp; then
            echo "::error::the unflagged parity gate did not COMPILE — that is a build failure, not evidence about LAW 1"
            exit 1
          fi

          if ./build/pb_fma > /tmp/unflagged.txt 2>&1; then
            echo "::error::parity passed WITHOUT -ffp-contract=off on $(uname -m) — LAW 1's evidence has changed. Re-measure the claim; do not relax the gate."
            tail -5 /tmp/unflagged.txt
            exit 1
          fi
          echo "confirmed: the unflagged build still fails, as it must"
          grep -Ei "failed|mismatch" /tmp/unflagged.txt | tail -3 || true

  plugin-compile-check:
    name: Compile the plugin sources (Linux, fast)
    runs-on: ubuntu-latest
    needs: harnesses
    steps:
      - uses: actions/checkout@v5

      # Catches API misuse in seconds, before a macOS runner is spent on it.
      # This does NOT produce a loadable plugin — AU is macOS-only — it just
      # proves the translation units are sound.
      - name: Fetch JUCE (pinned, shallow)
        run: git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git /tmp/juce7

      - name: Compile PluginProcessor and PluginEditor
        working-directory: PALLBEARER
        run: bash tools/compile_check.sh /tmp/juce7/modules

  plugin-macos:
    name: Build AU/VST3 (macOS)
    runs-on: macos-14
    needs: plugin-compile-check
    defaults:
      run:
        working-directory: PALLBEARER
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -S pallbearer-juce -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: List artefacts
        run: find build -name "*.component" -o -name "*.vst3" -o -name "*.app" | head -20

      # `path:` is an input to a `uses:` action, so working-directory does NOT
      # apply — spelled from the repo root or the upload finds nothing and
      # only warns.
      # ---- SIGN AND NOTARIZE, added 2026-08-23 ----------------------------
      # Runs ONLY when the six MACOS_* secrets exist, and skips with a clear
      # message otherwise, so this workflow stays green today and starts
      # producing installable bundles the moment Ben enrols. It is the only
      # step in the estate that needs his Apple account.
      #
      # WHY THIS MATTERS MORE THAN IT SOUNDS. Without a Developer ID these
      # plugins fail SILENTLY on anyone else's Mac. No dialog, no warning,
      # the plugin simply never appears, and the person concludes it is
      # broken rather than unsigned. Right-click Open does not substitute:
      # that trick is for apps, and a plugin has no icon anyone opens.
      #
      # PROVENANCE. Not written from scratch. This block already existed,
      # fully formed, in .github/workflows/build.yml, NECROPHONE's workflow,
      # which is not tracked by this repo and which nobody had read. The
      # standing handoff recorded this work as "NOT yet built" while it sat
      # finished in an untracked file. Ported here rather than reinvented.
      #
      # CORRECTION TO THE HANDOFF: it calls this "a two-secret change". It is
      # SIX, and the list is below. Cheap either way, but a person planning
      # an evening around it should know.
      #
      # WHAT IS AND IS NOT VERIFIED. The SKIP path is tested: with no secrets
      # set the step prints and exits 0, which is the behaviour that has to
      # hold today. The SIGNING path cannot be tested from here at all, since
      # it needs a macOS runner and a real certificate. It is faithful to the
      # NECROPHONE original rather than improved, deliberately.
      #
      # ONE KNOWN WART, carried over rather than silently changed: `--deep`
      # is discouraged by Apple for distribution signing, which prefers
      # nested code signed individually. It is very likely fine for a JUCE
      # bundle. Flagged so the first real signing run knows where to look if
      # notarization is rejected.
      - name: Sign and notarize (only when the secrets exist)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEV_ID: ${{ secrets.MACOS_DEV_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "$CERT_P12" ] || [ -z "$DEV_ID" ]; then
            echo "No macOS signing secrets set, so skipping signing."
            echo "Expected until the six MACOS_* repo secrets exist:"
            echo "  MACOS_CERT_P12           base64 of the Developer ID .p12"
            echo "  MACOS_CERT_PASSWORD      the .p12 password"
            echo "  MACOS_DEV_ID             e.g. Developer ID Application: NAME (TEAMID)"
            echo "  MACOS_NOTARY_APPLE_ID    the Apple ID that owns the account"
            echo "  MACOS_NOTARY_TEAM_ID     the team identifier"
            echo "  MACOS_NOTARY_PASSWORD    an app-specific password, not the account one"
            echo "The unsigned bundle above is fine on the machine that built it."
            exit 0
          fi
          KPW=$(uuidgen)
          security create-keychain -p "$KPW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KPW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" build.keychain
          rm -f cert.p12
          find build \( -name '*.vst3' -o -name '*.component' \) -print | while read -r b; do
            echo "signing $b"
            codesign --force --deep --options runtime --timestamp --sign "$DEV_ID" "$b"
          done
          find build \( -name '*.vst3' -o -name '*.component' \) -print | while read -r b; do
            echo "notarizing $b"
            ditto -c -k --keepParent "$b" "$b.zip"
            xcrun notarytool submit "$b.zip" --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$b"
            rm -f "$b.zip"
          done
          echo "signed and notarized. These bundles install with no Gatekeeper warning."

      - name: Upload plugin artefacts
        uses: actions/upload-artifact@v5
        with:
          name: pallbearer-plugins-macos
          path: |
            PALLBEARER/build/**/*.component
            PALLBEARER/build/**/*.vst3
          if-no-files-found: warn
