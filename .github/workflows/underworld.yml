name: UNDERWORLD

# LAYOUT NOTE. Like the trilogy workflows, this belongs at the ESTATE ROOT, because
# underworld/ reaches outside itself (../AUTOPSY, ../RIGOR, ../CASKET, ../shared) through the
# cores' public API only (LAW 0). The full repo checkout satisfies those relative requires.

on:
  push:
    paths: ['underworld/**', '.github/workflows/underworld.yml']
  pull_request:
    paths: ['underworld/**']

jobs:
  seam-suite:
    name: seam suite + C++ skeleton
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # the whole JS seam suite (200+ assertions, incl. the JS<->C++ parity harness which
      # compiles the C++ CLI itself)
      - name: run seam suite
        run: node underworld/run-tests.js
      # the C++ host path builds via CMake with the trilogy's mandatory flag (§4 LAW 1) and
      # runs its own unit tests
      - name: build & test the C++ host path
        run: |
          cmake -S underworld/cpp -B /tmp/uwcpp
          cmake --build /tmp/uwcpp
          ctest --test-dir /tmp/uwcpp --output-on-failure
