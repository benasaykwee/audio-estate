name: RIGOR

# LAYOUT NOTE. This file belongs at the ESTATE ROOT, not inside RIGOR/.
# GitHub only reads workflows from <repo-root>/.github/workflows — a copy
# living at RIGOR/.github/workflows is silently ignored, which is the
# failure mode that leaves a project with no CI and no error to notice.
#
# Because the checkout lands at the estate root, every `run:` step needs to
# start inside RIGOR/. That is what the `defaults.run.working-directory`
# below does. NOTE that it applies to `run:` steps ONLY — inputs to `uses:`
# actions (notably upload-artifact's `path:`) are still resolved from the
# repo root and must name RIGOR/ explicitly.

on:
  push:
    paths: ['RIGOR/**', 'shared/**', '.github/workflows/rigor.yml']
  pull_request:
    paths: ['RIGOR/**', 'shared/**', '.github/workflows/rigor.yml']

# ADDED 2026-08-18. Every trilogy workflow used to trigger on every push with
# no filter, so a CASKET-only commit still paid for AUTOPSY's, RIGOR's and
# PALLBEARER's own harnesses AND their 10x-billed macOS plugin builds, for no
# reason found in any of their triggers. shared/** stays in the filter
# deliberately — RIGOR's own tests import it directly.

jobs:
  harnesses:
    name: JS harnesses + parity gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RIGOR
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Core tests
        run: node tests/rigor_test.js

      - name: UI-logic tests
        run: node tests/rigor_ui_test.js

      - name: Plugin lint (JUCE sources, no compiler needed)
        run: node tests/rigor_plugin_test.js

      - name: Fuzzer (seeded, so a failure reproduces)
        run: node tests/rigor_fuzz.js 1200

      - name: Audits (latency, automation, transitions, extremes)
        run: node tests/rigor_audit.js

      - name: Regression (byte-stable baselines)
        run: node tests/rigor_regression.js

      # The styles document claimed for a whole round to be generated by a
      # file that did not exist, and drifted until it asserted the opposite
      # of the code. Running the generator in CI does not update the doc —
      # it proves the generator still runs and that no style pair disagrees
      # with its own path signature, which is the check that would have
      # caught the drift.
      - name: Styles (every pair, path vs render)
        run: |
          node tests/rigor_styles.js | tee /tmp/styles.txt
          ! grep -q 'MISMATCH' /tmp/styles.txt

      - name: Stress (hostile input samples, determinism, block boundaries)
        # A non-finite sample used to lock the audio thread forever. Nothing
        # in the suite had ever handed the engine a bad SAMPLE — only bad
        # settings — so 198 tests stayed green through a hung DAW.
        run: node tests/rigor_stress.js

      - name: Coverage census (is anything unwatched?)
        # --strict fails on a state field that is not sanitised, read,
        # ported, exposed both ways and named by some harness, unless it is
        # listed as a deliberate exemption with a reason.
        run: node tests/rigor_coverage.js --strict

      - name: Mutation (break the core, demand the suite notice)
        # A green suite is only worth what it would catch. Five of twelve
        # mutants once walked straight through the whole thing.
        run: node tests/rigor_mutate.js

      - name: Sync is current (all three embeds byte-identical, idempotent)
        # --check writes nothing and exits 1 if the instrument in the browser
        # is running different code from the one the tests just passed on.
        run: |
          node rigor_sync.js --check
          md5sum rigor.html > /tmp/before.md5
          node rigor_sync.js
          md5sum rigor.html > /tmp/after.md5
          diff /tmp/before.md5 /tmp/after.md5

      - name: Parity gate (JS truth vs C++ twin, bit-exact)
        # PARITY LAW: -ffp-contract=off. FMA contraction fuses a*b+c into one
        # rounding where the JS engine performs two. Settling's feedback path
        # compounds that single ulp through a nonlinear gain computer, so it
        # is the first case to break if this flag ever goes missing.
        run: |
          node tests/parity_emit.js
          git diff --exit-code tests/parity_expected.h
          g++ -std=c++17 -O2 -ffp-contract=off -o core_parity tests/core_parity.cpp
          ./core_parity

      # The twin is what ships, so the twin is what gets a published CPU
      # figure. Same flags as the parity gate above, deliberately: a faster
      # build that fails parity would be a number for a different plugin.
      # Not gated on a threshold — CI runners vary too much for that to mean
      # anything — but the number is in the log for every commit.
      - name: CPU budget, the C++ twin
        run: |
          g++ -std=c++17 -O2 -ffp-contract=off -o core_bench tests/core_bench.cpp
          ./core_bench

  plugin-macos:
    name: Build AU/VST3 (macOS)
    runs-on: macos-14
    needs: harnesses
    defaults:
      run:
        working-directory: RIGOR
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -S rigor-juce -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 3

      - name: List artefacts
        run: find build -name "*.component" -o -name "*.vst3" -o -name "*.app" | head -20

      # `path:` is an input to a `uses:` action, so working-directory does NOT
      # apply — these must be spelled from the repo root or the upload finds
      # nothing and only warns.
      - name: Upload plugin artefacts
        uses: actions/upload-artifact@v5
        with:
          name: rigor-plugins-macos
          path: |
            RIGOR/build/**/*.component
            RIGOR/build/**/*.vst3
          if-no-files-found: warn
