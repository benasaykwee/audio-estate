name: CASKET

# LAYOUT NOTE. This file belongs at the ESTATE ROOT, not inside CASKET/.
# GitHub only reads workflows from <repo-root>/.github/workflows, and CASKET
# reaches outside its own directory in three ways that a CASKET-only repo
# cannot satisfy: ../shared/necromath.js, ../shared/necrodyn.js, and ../AUTOPSY
# for the tripwire job. Every job therefore sets working-directory rather than
# assuming it is already in the project.

on:
  push:
  pull_request:
  schedule:
    # 04:00 UTC nightly — the long jobs live here so they can never become
    # the reason somebody stops pushing.
    - cron: '0 4 * * *'

jobs:
  harnesses:
    name: JS harnesses (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: CASKET
    strategy:
      # Do NOT cancel the whole matrix on one red cell. If bit-exactness
      # breaks on exactly one platform, that single cell IS the finding,
      # and killing its siblings destroys the comparison that identifies it.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Core tests (the guarantee, BS.1770, the null test)
        run: node tests/casket_test.js

      - name: UI-logic tests (UIH headless, embeds, the boot path)
        run: node tests/casket_ui_test.js

      # THE REASON THIS MATRIX EXISTS. Every hash and every parity check in
      # this project is bit-exact on ONE machine, which makes bit-exactness
      # a hypothesis rather than a fact. Node ships different V8 versions on
      # different platforms, and V8 is free to change how it evaluates the
      # same arithmetic. necromath exists precisely so that it cannot — but
      # "exists so that it cannot" is a claim, and this is the experiment.
      - name: Regression (byte-stable baselines — the cross-platform claim)
        run: node tests/casket_regression.js

      - name: NaN audit (silence is a legal input everywhere)
        run: node tests/casket_nan_audit.js

      - name: Fuzz (random legal states across five sample rates)
        run: node tests/casket_fuzz.js 1500

      - name: Automation stress (setState between every block)
        run: node tests/casket_automation.js 150

      - name: Dither quality (the shaping must actually shape)
        run: node tests/casket_dither.js

      - name: Edge cases (subnormals, signed zero, degenerate buffers)
        run: node tests/casket_edge.js

      - name: Conformance (BS.1770 true peak, the reconstruction ladder, EBU 3341/3342)
        run: node tests/casket_conformance.js

      # MEASURED 2026-08-16: this is the most expensive harness in the set by
      # a wide margin — 60 states ran past 200 seconds on a machine where the
      # whole rest of the suite finishes in under 300. Trimmed to 25 on the
      # push path; the nightly job runs it properly.
      - name: Offline-tools fuzz (autoDrive, difference, autoMargin, matchReference)
        run: node tests/casket_tools_fuzz.js 25

      - name: The seal vs the margin (two features on the same axis)
        run: node tests/casket_seal_margin.js

      - name: Batch and album (one drive, gapless joins, the dither policy)
        run: node tests/casket_album.js

      - name: Plugin lint (the checks that do not need a compiler)
        run: node tests/casket_plugin_test.js

      - name: Host boundary (block size, chunking, latency, the mono bus)
        run: node tests/casket_host.js

      - name: Sample-rate conversion (a 44.1 file in a 96 session)
        run: node tests/casket_rate.js

      # ADDED 2026-08-18. autoDrive, autoMargin and matchReference each hand
      # the user a number and ask them to trust it; nothing else re-derives
      # the claim by a route that does not run back through the function
      # being checked. Same idea as RIGOR's rigor_audit.js.
      - name: Audits (autoDrive, autoMargin, matchReference — checked from outside)
        run: node tests/casket_audit.js

      # ADDED 2026-08-18. Same idea as RIGOR's rigor_coverage.js: a green
      # suite only answers for what it was told to watch. This asks which
      # state fields nothing watches at all.
      - name: Coverage census (is anything unwatched?)
        run: node tests/casket_coverage.js --strict

      # ADDED 2026-08-18. The ONLY test in this project that runs two threads.
      # It found two real bugs in Handoff<T> the day it was written — an ABA
      # on the slot index, and a missing acquire fence that let the compiler
      # sink the struct copy past its own verification. Neither is visible by
      # reading the code and neither can be caught single-threaded, so this
      # runs on every push rather than nightly. It also runs its own controls:
      # if the unprotected arm stops tearing, the run reports itself
      # inconclusive rather than passing.
      # `shell: bash` is REQUIRED, not cosmetic — added 2026-08-21. Without it
      # windows-latest runs this in PowerShell, where a failed g++ does not
      # stop the script and the next line reports the missing binary as
      # "'./build/handoff' is not recognized as a name of a cmdlet". That is a
      # COMPILE error wearing a runtime error's clothes, and it cost a session:
      # the real cause (M_PI undefined on MinGW, now fixed in necromath.h) had
      # scrolled off, so the failure was read as a threading fault in the seam
      # and hunted as a memory-ordering bug for a day. Under bash the compile
      # failure aborts the step and prints as itself.
      - name: The audio/UI seam (trace fold, then Handoff under contention)
        shell: bash
        run: |
          mkdir -p build
          g++ -std=c++17 -O2 -pthread -o build/handoff tests/handoff_stress.cpp
          ./build/handoff

      # ADDED 2026-08-19. Compiles both plugin translation units against real
      # JUCE 7.0.12 headers — the whole class of first-build failure (missing
      # includes, wrong signatures, API drift) caught in ~40 s on a 1×-billed
      # Linux runner instead of surfacing in the 10×-billed macOS plugin job.
      #
      # ONE CELL ONLY, and that is deliberate: this is a C++ compile, not a
      # JS harness, so running it across the whole six-cell os×node matrix
      # would pay for the same answer six times. The macOS job below is what
      # proves the plugin BUILDS and links; this only proves it is sound C++.
      # A JUCE checkout is ~500 MB, so it is cached on the tag.
      - name: Cache JUCE 7.0.12
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        id: juce-cache
        uses: actions/cache@v5
        with:
          path: /tmp/juce-7.0.12
          key: juce-7.0.12-shallow
      - name: Plugin sources compile against JUCE (fast, before the 10× job finds out)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: bash tools/compile_check.sh

      # A shared/ change by any sibling project leaves CASKET's three embeds
      # stale, and the failure surfaces here rather than where it was caused.
      # That is the point: this step is the estate's tripwire in reverse.
      - name: Sync is current (three embeds byte-identical, idempotent)
        shell: bash
        run: |
          node casket_sync.js
          git diff --exit-code casket.html

  autopsy-tripwire:
    name: AUTOPSY is undisturbed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AUTOPSY
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      # CASKET shares shared/necromath.js with AUTOPSY. If a change here
      # ever touches NM, AUTOPSY's hashes move — and AUTOPSY is a sealed
      # artifact. This job is the tripwire, and it must never need fixing.
      #
      # FIXED 2026-08-16: this used to open with `cd ../AUTOPSY`, which
      # escaped the checkout entirely and would have failed on the first
      # run under any repo layout.
      - name: Run AUTOPSY's full suite
        run: |
          node tests/autopsy_test.js
          node tests/autopsy_ui_test.js
          node tests/autopsy_regression.js
          node tests/parity_emit.js
          git diff --exit-code tests/parity_expected.h

  parity:
    name: Parity gate (JS truth vs the C++ twin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CASKET
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }

      # The emitted expectations must be reproducible before they are
      # trusted. A gate generated fresh from the code it is gating proves
      # nothing; this proves the generator is deterministic first.
      - name: The gate is not stale
        run: |
          node tests/parity_emit.js
          git diff --exit-code tests/parity_expected.h

      # PARITY LAW: -ffp-contract=off. Not belt-and-braces — without it
      # this gate reports thousands of mismatches, the worst at 9,805 ulp.
      # The polyphase inner loop is a long multiply-accumulate chain,
      # exactly the shape GCC most wants to fuse into FMAs.
      - name: Bit-exact at -O0, -O2 and -O3
        run: |
          for O in 0 2 3; do
            g++ -std=c++17 -O$O -ffp-contract=off -o cp$O tests/core_parity.cpp
            ./cp$O
          done

      # ADDED 2026-08-21. `if: always()` because the step above EXITS 1 on the
      # -O3 failure, and the whole point of this one is to describe that
      # failure. Without it the diagnostic only ever runs when there is
      # nothing to diagnose.
      #
      # The gate reports one mismatching scalar at a time and all seven fields
      # of a DriveResult share the label "autoDrive[noise][pine]", so reading
      # four sampled lines out of it is how a previous session concluded the
      # bisection was flipping a branch. This prints the WHOLE result for every
      # case, plus the LUFS at every drive the search can visit, at all three
      # -O levels. A reported lufs can then be traced back to the drive that
      # produced it instead of guessed at.
      #
      # It asserts nothing and never fails the build. It is an instrument.
      - name: What autoDrive actually returns at each -O level (diagnostic)
        if: always()
        run: |
          for O in 0 2 3; do
            g++ -std=c++17 -O$O -ffp-contract=off -o ad$O tests/autodrive_probe.cpp \
              || { echo "-O$O: probe failed to compile"; continue; }
            echo "==================== -O$O ===================="
            ./ad$O || echo "-O$O: probe crashed"
          done
          echo ""
          echo "==================== DIFFS ===================="
          ./ad0 > ad0.out 2>&1 || true
          ./ad2 > ad2.out 2>&1 || true
          ./ad3 > ad3.out 2>&1 || true
          if diff -u ad0.out ad2.out; then echo "  -O0 and -O2 agree"; fi
          if diff -u ad2.out ad3.out; then echo "  -O2 and -O3 agree"; else
            echo ""
            echo "::warning::-O2 and -O3 disagree above. Match any differing lufs"
            echo "::warning::against THE LADDER to find the drive that produced it."
          fi

      # ADDED 2026-08-21, and this is now the prime suspect.
      #
      # THE FINDING THAT PUT IT HERE. On this runner, this commit, this
      # compiler and these flags, tests/autodrive_probe.cpp at -O3 returns
      # autoDrive[noise][pine] = drive -12, lufs -10.610348533556301 (the
      # correct JS truth) and its -O0/-O2/-O3 outputs are byte-identical.
      # tests/core_parity.cpp at -O3 calls the SAME function with the SAME
      # inputs on the SAME machine and gets -8.3603485335562979.
      #
      # Same function, different translation unit, different answer. That is
      # not a bug in autoDrive's arithmetic, and no amount of canonicalising
      # a comparison will reach it. What differs is that core_parity.cpp pulls
      # in 575 KB of parity_expected.h and runs thousands of checks before it
      # ever calls autoDrive — so the candidates are memory corruption in an
      # earlier section, or an IPA/inlining miscompile only a TU this large
      # provokes.
      #
      # ASan and UBSan are the cheap discriminator: an overrun in an earlier
      # section surfaces immediately, and UB surfaces whether or not the -O3
      # codegen happens to expose it.
      #
      # CAVEAT, so nobody misreads a green: ASan changes stack layout, so a
      # corruption bug CAN go quiet under it. A clean run does not clear the
      # hypothesis. A dirty one convicts.
      # ADDED 2026-08-23, after CASKET #22 disproved the low-rail hypothesis.
      # In that run, at -O3, in THIS translation unit, autoDrive returned the
      # wrong answer to a check and the RIGHT answer to the forensics probe a
      # few calls later, with identical arguments. So the fault is CALL
      # dependent, not translation-unit dependent, and the two remaining
      # explanations cannot be told apart from outside the call:
      #
      #   * the search reached a wrong `best`, or
      #   * the search was right and the answer was corrupted on the way out.
      #
      # This builds the SAME file a second time with the trace hook compiled in
      # and prints autoDrive's whole decision path: every candidate weighed,
      # which one was taken, the window at each pass, the quantise, and the
      # verification render. Whichever line first disagrees with the healthy
      # trace names the bug.
      #
      # A SECOND BUILD ON PURPOSE. The gate above is left completely untouched,
      # because printf in the hot path changes inlining, register pressure and
      # stack layout, and this bug already behaves like something sensitive to
      # exactly those. Instrumenting the gate itself could easily make the
      # failure disappear and teach nothing. With the macro undefined the object
      # code is byte-identical, verified by compiling both ways and comparing
      # md5 (bd691d45... both), so the gate really is unchanged.
      #
      # AND IF THIS TRACE COMES BACK HEALTHY while the gate above stays red,
      # that is a RESULT, not a failure: a fault that vanishes when observed is
      # evidence for the memory and layout family and against a logic error.
      - name: autoDrive's decision path, from INSIDE the failing call (diagnostic)
        if: always()
        run: |
          g++ -std=c++17 -O3 -ffp-contract=off -DCASKET_TRACE_AUTODRIVE \
              -o cp3trace tests/core_parity.cpp \
            || { echo "trace build failed — not treating that as a verdict"; exit 0; }
          echo "Healthy looks like: the -12 rail TAKEN first, every midpoint kept,"
          echo "search done bestDrive=-12, quantize -12, verification render -10.6103485."
          echo "Roughly 325 lines and 22 traced calls on a clean machine."
          echo "=============================================================="
          ./cp3trace 2>&1 | head -120 || true
          echo "(diagnostic only — this step never fails the build)"

      - name: Sanitisers on the parity gate (is something corrupting it?)
        if: always()
        run: |
          g++ -std=c++17 -O3 -ffp-contract=off -g \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -o cp3san tests/core_parity.cpp \
            || { echo "sanitiser build failed — not treating that as a verdict"; exit 0; }
          ASAN_OPTIONS=detect_leaks=0 ./cp3san 2>&1 | tail -45 || true
          echo "(diagnostic only — this step never fails the build)"

  counts:
    name: The docs' numbers are derived, not remembered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }

      # Same shape as the parity gate: regenerate, then prove nothing moved.
      # tools/counts.js runs all three gates and the asserting harnesses and
      # rewrites the figures between the <!--c:key--> markers in the docs. If
      # this job goes red, a document is quoting a number its gate no longer
      # produces — which happened four different ways to RIGOR's row in a
      # single hour before this existed.
      #
      # The script is idempotent by construction: each figure carries the date
      # it last CHANGED rather than the date it was last confirmed, so a run
      # that finds nothing moved writes nothing and this job stays green
      # without anybody re-blessing a timestamp every morning.
      #
      # Two slow harnesses come from tools/counts.json rather than being
      # re-run here; the nightly job re-measures them with --full, which is
      # the only way a cached value can go stale unnoticed.
      - name: Regenerate every derived count
        run: node tools/counts.js

      - name: And prove no document had drifted
        run: git diff --exit-code

  cpu:
    name: CPU gate (the shape of the cost)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CASKET
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      # Ratios against a same-machine calibration, never absolute
      # milliseconds — a shared runner's absolute speed is not a property
      # of this code and gating on it would only teach people to ignore
      # the gate.
      - name: Performance is defended like correctness
        run: node tests/casket_cpu_gate.js

  nightly:
    name: Nightly soak
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CASKET
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }

      # FIXED 2026-08-16: this used to invoke the soak with no argument.
      # The default is 20 minutes PER ARRANGEMENT and there are five of
      # them, so the step needed 100 minutes and the timeout below killed
      # it at 90 — a nightly that could only ever go red. Twelve minutes
      # each is 60 total, which fits with room to spare.
      - name: Soak (long-run drift)
        run: node tests/casket_soak.js 12
        timeout-minutes: 90

      - name: Deep fuzz (far more states than a push can afford)
        run: node tests/casket_fuzz.js 20000

      - name: Offline-tools fuzz, at full strength
        run: node tests/casket_tools_fuzz.js 60

      # ADDED 2026-08-18. MASTERING_WITH_CASKET.md promises every figure a
      # named harness; this re-runs each cited harness and confirms the
      # number still appears in its output. ~80 s because five real
      # harnesses run — too slow for every push, exactly right here. It is
      # informational by design (exit 0 either way), so the nightly stays
      # green while the log carries the verdict; the tool's own --self-test
      # runs first and DOES gate, because a broken extractor would make the
      # report below it meaningless.
      # Widened 2026-08-19 to FIVE documents (the mastering doc, the README,
      # the docs/ pair, and the architecture doc). ~3 minutes measured.
      #
      # It runs 8 of the 14 cited harnesses: a citation with no figure
      # attached is still reported, but its harness is never executed,
      # because running a program to verify zero numbers is waste. That
      # matters more than it sounds — casket_soak.js and casket_tools_fuzz.js
      # are both cited by the README's new flags section, and their DEFAULT
      # invocations are twenty minutes per arrangement and sixty fuzz states
      # respectively. Before the skip, adding those two citations would have
      # turned this step into an hour of re-running the estate's longest
      # harnesses to check nothing.
      # Nightly-only, and informational by design.
      - name: Doc citations (every CASKET doc's numbers, re-measured)
        timeout-minutes: 15
        run: |
          node tools/check_mastering_citations.js --self-test
          node tools/check_mastering_citations.js

      # The push path takes two CASKET harness counts from the cache because
      # they cost three and a half minutes between them. A cached number is
      # the one that can rot without anyone noticing, so re-measure it here.
      - name: Every derived count, nothing cached
        working-directory: .
        run: |
          node tools/counts.js --full
          git diff --exit-code

      # The bench is not a gate — the CPU gate is. But a benchmark nobody
      # ever runs is a benchmark nobody trusts, and it costs nothing here.
      - name: Bench (absolute figures, for the record rather than for a gate)
        run: node tests/casket_bench.js

      # Kept because it is the runnable evidence behind architecture §6.3 —
      # why the residual form of the seal was rejected. Evidence you cannot
      # execute is just a claim with a filename.
      - name: The seal experiment (evidence for architecture §6.3)
        run: node tests/seal_experiment.js

      # ADDED 2026-08-16. Twelve deliberate breaks; the suite must go red for
      # nine of them and stay green for the three marked equivalent. Nightly
      # rather than per-push because each mutant reruns the whole witness
      # harness, so a full pass is roughly twelve minutes.
      #
      # On its first run it found three real holes: the overshoot theorem's
      # HYPOTHESIS was never asserted (only its consequences, which a clamp
      # stands in front of), the bypass TOGGLE was never exercised, and
      # `quantize` had no JavaScript test at all — its only guard was the
      # parity gate, which proves the twins agree and not that either is
      # right.
      - name: Mutation tester (a test for the tests)
        run: node tests/casket_mutate.js
        timeout-minutes: 30

  plugin:
    name: AU / VST3 build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -S CASKET/casket-juce -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Parity gate on the plugin's own toolchain
        run: ./build/casket_parity

      # ADDED 2026-08-16. The gate above builds without LTO, but the plugin
      # links juce_recommended_lto_flags, so its arithmetic is generated at
      # link time under flags the gate was never measuring. This target uses
      # the plugin's exact flag set. Verified on GCC/Linux that the check can
      # fail: -O2 -flto with no contraction flag breaks parity outright.
      # Clang on macOS is the toolchain that actually ships, which is why the
      # measurement belongs here rather than on one developer's machine.
      - name: Parity gate under the plugin's LTO flags (the binary you ship)
        run: ./build/casket_parity_lto

      # FIXED 2026-08-16: the artefact FILES are named after PRODUCT_NAME,
      # which is "CASKET" in caps, while the artefacts DIRECTORY is named
      # after the CMake target, which is "Casket". The old paths said
      # Casket.vst3 and Casket.component and only worked by accident,
      # because the runner's APFS volume is case-insensitive.
      #
      # pluginval's strictness 10 includes varying the block size between
      # calls — precisely the class of bug that cost this project a whole
      # round, and which our own harnesses only found after being taught
      # to try prime-length buffers.
      - name: pluginval (strictness 10)
        run: |
          curl -sL https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip -o pluginval.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 10 \
            --validate-in-process \
            --validate build/Casket_artefacts/Release/VST3/CASKET.vst3

      # FIXED 2026-08-16: the manufacturer code was written as Necr, but
      # CMakeLists declares PLUGIN_MANUFACTURER_CODE Basy. auval takes
      # <type> <subtype> <manufacturer>, so the old line asked the system
      # for a component that does not exist and would have failed every run.
      - name: auval (the AU gatekeeper Logic itself uses)
        run: |
          cp -R build/Casket_artefacts/Release/AU/CASKET.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Cskt Basy

      # ---- SIGN AND NOTARIZE, added 2026-08-23 ----------------------------
      # Runs ONLY when the six MACOS_* secrets exist, and skips with a clear
      # message otherwise, so this workflow stays green today and starts
      # producing installable bundles the moment Ben enrols. It is the only
      # step in the estate that needs his Apple account.
      #
      # WHY THIS MATTERS MORE THAN IT SOUNDS. Without a Developer ID these
      # plugins fail SILENTLY on anyone else's Mac. No dialog, no warning,
      # the plugin simply never appears, and the person concludes it is
      # broken rather than unsigned. Right-click Open does not substitute:
      # that trick is for apps, and a plugin has no icon anyone opens.
      #
      # PROVENANCE. Not written from scratch. This block already existed,
      # fully formed, in .github/workflows/build.yml, NECROPHONE's workflow,
      # which is not tracked by this repo and which nobody had read. The
      # standing handoff recorded this work as "NOT yet built" while it sat
      # finished in an untracked file. Ported here rather than reinvented.
      #
      # CORRECTION TO THE HANDOFF: it calls this "a two-secret change". It is
      # SIX, and the list is below. Cheap either way, but a person planning
      # an evening around it should know.
      #
      # WHAT IS AND IS NOT VERIFIED. The SKIP path is tested: with no secrets
      # set the step prints and exits 0, which is the behaviour that has to
      # hold today. The SIGNING path cannot be tested from here at all, since
      # it needs a macOS runner and a real certificate. It is faithful to the
      # NECROPHONE original rather than improved, deliberately.
      #
      # ONE KNOWN WART, carried over rather than silently changed: `--deep`
      # is discouraged by Apple for distribution signing, which prefers
      # nested code signed individually. It is very likely fine for a JUCE
      # bundle. Flagged so the first real signing run knows where to look if
      # notarization is rejected.
      - name: Sign and notarize (only when the secrets exist)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          DEV_ID: ${{ secrets.MACOS_DEV_ID }}
          NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        shell: bash
        run: |
          set -e
          if [ -z "$CERT_P12" ] || [ -z "$DEV_ID" ]; then
            echo "No macOS signing secrets set, so skipping signing."
            echo "Expected until the six MACOS_* repo secrets exist:"
            echo "  MACOS_CERT_P12           base64 of the Developer ID .p12"
            echo "  MACOS_CERT_PASSWORD      the .p12 password"
            echo "  MACOS_DEV_ID             e.g. Developer ID Application: NAME (TEAMID)"
            echo "  MACOS_NOTARY_APPLE_ID    the Apple ID that owns the account"
            echo "  MACOS_NOTARY_TEAM_ID     the team identifier"
            echo "  MACOS_NOTARY_PASSWORD    an app-specific password, not the account one"
            echo "The unsigned bundle above is fine on the machine that built it."
            exit 0
          fi
          KPW=$(uuidgen)
          security create-keychain -p "$KPW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KPW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" build.keychain
          rm -f cert.p12
          find build \( -name '*.vst3' -o -name '*.component' \) -print | while read -r b; do
            echo "signing $b"
            codesign --force --deep --options runtime --timestamp --sign "$DEV_ID" "$b"
          done
          find build \( -name '*.vst3' -o -name '*.component' \) -print | while read -r b; do
            echo "notarizing $b"
            ditto -c -k --keepParent "$b" "$b.zip"
            xcrun notarytool submit "$b.zip" --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
            xcrun stapler staple "$b"
            rm -f "$b.zip"
          done
          echo "signed and notarized. These bundles install with no Gatekeeper warning."

      - uses: actions/upload-artifact@v5
        with:
          name: casket-plugins
          path: build/Casket_artefacts/Release
